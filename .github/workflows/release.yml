name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          # `changeset publish` does NOT accept --access/--provenance (they are
          # npm-publish flags and make changesets exit with "Unknown flags").
          # Access is set via `.changeset/config.json` ("access": "public") and
          # each package's publishConfig; provenance is enabled through the
          # NPM_CONFIG_PROVENANCE env below, which changeset publish forwards to
          # `npm publish`. Trusted publishing (OIDC) is engaged via setup-node's
          # registry-url above.
          publish: pnpm changeset publish
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const publishedPackages = JSON.parse('${{ steps.changesets.outputs.publishedPackages }}');

            for (const pkg of publishedPackages) {
              const tagName = `${pkg.name}@${pkg.version}`;
              const releaseName = `${pkg.name} v${pkg.version}`;

              try {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tagName,
                  name: releaseName,
                  body: `## ${releaseName}\n\nSee [CHANGELOG](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/packages/${pkg.name.replace('@klarlabs-studio/fortify-', '')}/CHANGELOG.md) for details.`,
                  draft: false,
                  prerelease: pkg.version.includes('-'),
                });
                console.log(`Created release for ${tagName}`);
              } catch (error) {
                console.log(`Failed to create release for ${tagName}: ${error.message}`);
              }
            }

      - name: Verify Published Packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Verifying published packages..."
          sleep 10  # Wait for npm registry to update
          PACKAGES='${{ steps.changesets.outputs.publishedPackages }}'
          echo "$PACKAGES" | jq -r '.[].name' | while read pkg; do
            VERSION=$(echo "$PACKAGES" | jq -r --arg name "$pkg" '.[] | select(.name == $name) | .version')
            echo "Checking $pkg@$VERSION..."
            npm view "$pkg@$VERSION" version || echo "Warning: $pkg@$VERSION not yet available on npm"
          done
